version: '3.8'
name: general-database
services:
  postgres:
    image: postgres:16
    container_name: db-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
    - ${POSTGRES_PORT}:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: 
        ["CMD-SHELL", 
        "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 3
  mysql:
    image: mysql:8.4
    container_name: db-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - ${MYSQL_PORT}:3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 3

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: db-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: ${MSSQL_ACCEPT_EULA}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID}
    ports:
    - ${MSSQL_PORT}:1433
    volumes:
    - mssql_data:/var/opt/mssql
    - ./mssql/init.sql:/init.sql:ro
    command: >
      /bin/bash -c "
        /opt/mssql/bin/sqlservr &
        until /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' >/dev/null 2>&1;
        do
          sleep 2;
        done;
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -i /init.sql;
        wait
      "
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  mysql_data:
  mssql_data:
