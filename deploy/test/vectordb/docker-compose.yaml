version: "3.8"

name: test-vectordb

services:
  redisvector:
    image: redis/redis-stack:latest
    container_name: redisvector
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redisvector_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  redisvector_data: